if(tab===1)d.innerHTML=`<h2>防御相性</h2><div class="scroll"><table><tr><th>攻撃技</th>${st.team.map((_,i)=>`<th>${i+1}</th>`).join('')}<th>最良</th></tr>${A.map(i=>`<tr><td>${chip(i)}</td>${st.team.map(p=>{let v=p?def(i,p):Infinity;return `<td class="${v<1?'good':v>1&&v!==Infinity?'bad':''}">${fmt(v)}</td>`}).join('')}<td>${fmt(best(i))}</td></tr>`).join('')}</table></div>`;

if(tab===3){let env30=envList(30),envKeys=new Set(env30.map(p=>'e'+p.rank));let rows=[...st.team.map((p,i)=>p&&p.s!=null?{...p,key:'t'+i,n:p.n||'No.'+(i+1),own:true}:null).filter(Boolean),...custom.map((p,i)=>({...p,key:'c'+i,own:true})),...env30.map(p=>({...p,key:'e'+p.rank,m:sm,k:boost['e'+p.rank]||1,env:true})),...db.filter(p=>!env30.some(e=>e.id===p.id)).map(p=>({...p,key:'d'+p.id,m:sm,k:boost[p.id]||1}))].sort((a,b)=>speed(b)-speed(a));let t=rows.find(p=>p.key===target),own=rows.find(p=>p.key===ownKey);let need='';if(t){need=`<p>基準「${esc(t.n)}」の実数値：<b>${speed(t)}</b>／抜くために必要な実数値：<b>${speed(t)+1}</b></p>`;if(own&&own.s!=null){let n1=neededSP(own.s,speed(t),1),n2=neededSP(own.s,speed(t),1.1);need+=`<p>自分の「${esc(own.n)}」（S種族値${own.s}）が必要なSP：性格補正なし＝<b>${n1===null?'SP32でも抜けません':n1}</b>／補正あり(1.1)＝<b>${n2===null?'SP32でも抜けません':n2}</b></p>`}}d.innerHTML=`<h2>素早さライン（チャンピオンズ式・Lv.50相当）</h2><div class="row">相手・環境の設定 ${['無振り','準速','最速'].map((n,i)=>btn(n,'sm',i,sm===i)).join('')}</div><div class="row item"><input id="custom" type="number" min="1" max="255" placeholder="S種族値" style="width:120px">${btn('比較に追加','custom',0)}${btn('追加分を解除','clearcustom',0)}</div><div class="row"><select id="target"><option value="">比較基準（相手）を選択</option>${rows.map(p=>`<option value="${p.key}" ${target===p.key?'selected':''}>${esc(p.n)}：${speed(p)}</option>`).join('')}</select><select id="ownsel"><option value="">自分のポケモンを選択（必要SP計算用）</option>${rows.filter(p=>p.own).map(p=>`<option value="${p.key}" ${ownKey===p.key?'selected':''}>${esc(p.n)}</option>`).join('')}</select></div>${need}<div class="scroll"><table><tr><th>ポケモン</th><th>通常</th><th>1.5倍</th><th>2倍</th><th>現在値・設定</th></tr>${rows.map(p=>`<tr><td class="${p.own?'good':''}">${p.env?'環境#'+p.rank+' ':''}${esc(p.n)}${p.own?`<div>${['無振り','準速','最速'].map((n,i)=>`<button data-a="pm" data-key="${p.key}" data-i="${i}" class="${(p.sp==null?(p.m??sm):-1)===i?'on':''}">${n}</button>`).join('')}</div>`:''}</td>${[1,1.5,2].map(k=>`<td>${Math.floor(baseOf({...p,m:p.m??sm,sp:p.own?p.sp:null,nat:p.own?p.nat:undefined??1})*k)}</td>`).join('')}<td><b>${speed(p)}</b> ${t?(speed(p)>speed(t)?'先手':speed(p)<speed(t)?'後手':'同速'):''}<div>${[1,1.5,2].map(k=>`<button data-a="pk" data-key="${p.key}" data-i="${k}" class="${p.k===k?'on':''}">×${k}</button>`).join('')}</div></td></tr>`).join('')}</table></div><small>1.5倍＝スカーフ・S+1、2倍＝S+2等。小数点以下切り捨て。倍率の重複なし。自分のポケモンの任意SPは詳細入力で設定できます（表の通常/1.5倍/2倍はプリセット基準で表示）。</small>`}
if(tab===4){let combos=[];for(let i=0;i<18;i++)for(let j=i;j<18;j++)combos.push(manual(i===j?[i]:[i,j]));let score=p=>{let dg=un.filter(i=>def(i,p)<1),ag=miss.filter(i=>p.t.some(t=>mul(t,[i])>1)),fix=bad.filter(i=>def(i,p)<=1),rk=usageRank(p.n),bonus=rk?(rk<=10?5:rk<=30?3:rk<=50?1:0):0;return{p,dg,ag,fix,rk,v:dg.length*3+ag.length*2+fix.length*2+bonus}};let rankF=ps=>ps.map(score).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);let full=r().length===6;let improve=x=>`改善点：耐性補完 ${x.dg.length}件（${x.dg.map(i=>T[i]).join('・')||'なし'}）／攻撃補完 ${x.ag.length}件（${x.ag.map(i=>T[i]).join('・')||'なし'}）／弱点の一貫解消 ${x.fix.length}件${x.rk?`／環境使用率 #${x.rk}`:''}`;let show=(x,act,i)=>`<div class="item"><div class="between"><b>${esc(x.p.n)} ${chips(x.p.t)}</b>${full&&act==='addpk'?`<button data-a="swap" data-i="${i}" data-b="${esc(x.p.b)}">No.${swapSlot+1}と入れ替え</button>`:`<button data-a="${act}" data-i="${i}" data-t="${x.p.t.join(',')}" data-b="${esc(x.p.b)}" ${full?'disabled':''}>追加</button>`}</div><small>${esc(x.p.b)}　${improve(x)}</small><div>耐性補完：${chips(x.dg)||'なし'}</div></div>`;let rec=rankF(db.filter(p=>p.reg==='mc_listed'&&!r().some(q=>q.id===p.id)).flatMap(p=>p.a.map(b=>make(p,b))));let seen=new Set();d.innerHTML=`<h2>おすすめタイプ</h2>${rankF(combos).slice(0,5).map(x=>show(x,'addtype',0)).join('')||'補完不要'}<h2>おすすめサブウェポン</h2><small>※サブウェポンは「タイプ」の提案です。そのポケモンが実際にそのタイプの技を習得できるかは未照合のため、実戦投入前にゲーム内でご確認ください。</small>${A.filter(i=>!a.includes(i)).map(i=>({i,g:miss.filter(t=>mul(i,[t])>1)})).filter(x=>x.g.length).sort((a,b)=>b.g.length-a.g.length).slice(0,5).map(x=>`<div class="item between">${chip(x.i)} ${chips(x.g)}（攻撃不足 ${x.g.length}件を解消） ${btn('追加','attack',x.i)}</div>`).join('')||'補完不要'}<h2>おすすめポケモン（M-Cリスト掲載のみ）</h2>${full?`<div class="row">入れ替え対象：${st.team.map((p,i)=>btn('No.'+(i+1)+' '+(p?esc(p.n||'タイプのみ'):''),'swapslot',i,swapSlot===i)).join('')}</div><small>6匹登録済みのため「入れ替え候補」として提案します。入れ替えは確認後に実行されます。</small>`:''}${rec.filter(x=>!seen.has(x.p.id)&&seen.add(x.p.id)).slice(0,10).map(x=>show(x,'addpk',x.p.id)).join('')||'補完不要'}`}
if(tab===5)d.innerHTML=`<h2>保存・読み込み</h2><div class="row"><input id="name" value="${esc(st.name)}">${btn('保存','save',0)}</div>${Object.keys(saved).map((n,i)=>`<div class="item between">${esc(n)}<div>${btn('読込','load',i)} ${btn('削除','del',i)}</div></div>`).join('')}<p>構築コード（別端末への移行用）</p><textarea id="code" rows="5">${esc(JSON.stringify(st))}</textarea><div class="row">${btn('コピー','copy',0)}${btn('コードから読込','import',0)}</div><p id="msg"></p>`;}
function results(){let e=document.getElementById('results');if(!e)return;let norm=s=>s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96));e.innerHTML='<div class="picklist">'+((q?db.filter(p=>norm(p.n).includes(norm(q))):db.slice(0,6)).slice(0,20).map(p=>btn(esc(p.n)+' '+chips(p.t),'pick',p.id)).join(' ')||'未登録')+'</div>'}
const app=document.getElementById('app');
app.addEventListener('input',e=>{if(e.target.id==='search'){q=e.target.value;results()}if(e.target.id==='spslider'){let p=st.team[slot];if(p){if(p.sp==null){p.nat=effNat(p)}p.sp=+e.target.value;render()}}});
app.addEventListener('change',e=>{if(e.target.id==='ability'){st.team[slot].b=e.target.value;render()}if(e.target.id==='target'){target=e.target.value;render()}if(e.target.id==='ownsel'){ownKey=e.target.value;render()}});
app.addEventListener('click',e=>{let b=e.target.closest('button[data-a]');if(!b)return;let i=+b.dataset.i,k=b.dataset.key;switch(b.dataset.a){
case'mode':mode=i;break;case'slot':slot=i;q='';break;case'next':slot=(slot+1)%6;q='';break;case'remove':st.team[slot]=null;break;
case'reset':if(!confirm('現在の構築をリセットしますか？'))return;st=fresh();slot=0;break;
case'type':{let t=st.team[slot]?.t.slice()||[];if(t.includes(i))t=t.filter(x=>x!==i);else if(t.length<2)t.push(i);else return;st.team[slot]=t.length?manual(t):null;break}
case'ptype':if(pickTypes.includes(i))pickTypes=pickTypes.filter(x=>x!==i);else if(pickTypes.length<2)pickTypes.push(i);else return;break;
case'mctoggle':mcOnly=!mcOnly;break;
case'pick':{let src=db.find(p=>p.id===i);if(src)st.team[slot]=make(src);q='';break}
case'preset':{let p=st.team[slot];if(p){p.m=i;p.sp=null;p.nat=1}break}
case'nat':{let p=st.team[slot];if(p){if(p.sp==null)p.sp=effSP(p);p.nat=+b.dataset.v}break}
case'attack':if(atk().includes(i)){st.extra=st.extra.filter(x=>x!==i);st.off=[...new Set([...st.off,i])]}else{st.off=st.off.filter(x=>x!==i);st.extra=[...new Set([...st.extra,i])]}break;
case'auto':st.extra=[];st.off=[];break;case'tab':tab=i;break;case'envn':envN=i;break;case'swapslot':swapSlot=i;break;case'sm':sm=i;break;
case'custom':{let s=+document.getElementById('custom').value;if(Number.isInteger(s)&&s>=1&&s<=255)custom.push({n:'S'+s+'族',s,m:2,k:1,sp:null,nat:1});break}
case'clearcustom':custom=[];target='';ownKey='';break;
case'pm':case'pk':{let p=k[0]==='t'?st.team[+k.slice(1)]:k[0]==='c'?custom[+k.slice(1)]:null;if(p){if(b.dataset.a==='pm'){p.m=i;p.sp=null}else p.k=i}else if(k[0]==='d')boost[+k.slice(1)]=i;else if(k[0]==='e')boost[k]=i;break}
case'addtype':case'addpk':{let j=st.team.indexOf(null);if(j>=0){let src=db.find(p=>p.id===i);st.team[j]=b.dataset.a==='addtype'?manual(b.dataset.t.split(',').map(Number)):(src?make(src,b.dataset.b):null);slot=j}break}
case'swap':{let src=db.find(p=>p.id===i);if(src&&confirm(`No.${swapSlot+1}「${st.team[swapSlot]?.n||'タイプのみ'}」と「${src.n}」を入れ替えますか？`)){st.team[swapSlot]=make(src,b.dataset.b);slot=swapSlot}break}
case'usageimp':{try{let txt=document.getElementById('usageimport').value.trim();if(!txt)throw Error('empty');let doc;if(txt.startsWith('{')||txt.startsWith('[')){let j=JSON.parse(txt);doc=Array.isArray(j)?{entries:j}:j;if(!Array.isArray(doc.entries))throw Error('fmt')}else{let entries=txt.split('\n').map(l=>l.split(',').map(s=>s.trim())).filter(c=>c.length>=2&&c[0]&&!/名前|name/i.test(c[0])).map(c=>({name:c[0],rank:+c[1]||0,usage_pct:c[2]?+c[2]:null}));entries.sort((x,y)=>x.rank-y.rank);doc={entries}}doc.format='singles';doc.source='手動インポート';usageManual=doc;try{localStorage.setItem('pokebuild-usage-manual',JSON.stringify(doc))}catch{}document.getElementById('umsg').textContent='取り込みました（'+doc.entries.length+'件）';setTimeout(render,600);return}catch{document.getElementById('umsg').textContent='形式が正しくありません。CSV（名前,順位,使用率%）またはJSONで貼り付けてください。';return}}
case'usagedel':usageManual=null;try{localStorage.removeItem('pokebuild-usage-manual')}catch{}break;
case'save':{st.name=document.getElementById('name').value.trim()||'マイパーティ';saved[st.name]=JSON.parse(JSON.stringify(st));try{localStorage.setItem('pokebuild-saves',JSON.stringify(saved))}catch{alert('端末保存不可。構築コードを保管してください。')}break}
case'load':st=JSON.parse(JSON.stringify(saved[Object.keys(saved)[i]]));slot=0;break;
case'del':delete saved[Object.keys(saved)[i]];try{localStorage.setItem('pokebuild-saves',JSON.stringify(saved))}catch{}break;
case'copy':{let f=document.getElementById('code');f.select();try{document.execCommand('copy')}catch{}document.getElementById('msg').textContent='コードを選択しました。必要に応じて手動コピーしてください。';return}
case'import':try{let s=JSON.parse(document.getElementById('code').value);if(!Array.isArray(s.team)||s.team.length!==6||!s.team.every(p=>p===null||Array.isArray(p.t)&&p.t.length>=1&&p.t.length<=2&&p.t.every(i=>A.includes(i))&&Array.isArray(p.a)&&typeof p.n==='string'&&typeof p.b==='string'&&(p.s===null||Number.isFinite(p.s)))||!Array.isArray(s.extra)||!Array.isArray(s.off)||![...s.extra,...s.off].every(i=>A.includes(i)))throw Error();st=s;slot=0}catch{document.getElementById('msg').textContent='無効な構築コード';return}break;
}render()});
render();
// 外部データ読込（失敗しても内蔵フォールバックで動作を継続）
fetch('data/pokemon.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(j=>{if(Array.isArray(j.pokemon)&&j.pokemon.length){db=j.pokemon.map((p,i)=>({...p,id:i}));dbLoaded=true;render()}}).catch(()=>{});
fetch('data/usage.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(j=>{if(j&&Array.isArray(j.entries)){usageFetched=j;render()}}).catch(()=>{});
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js')}catch{}}
</script></body></html>
