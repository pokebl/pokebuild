name: 使用率データ自動更新（シングル）

on:
  schedule:
    # 約72時間ごと（3日に1回、UTC 03:17 = JST 12:17）
    - cron: '17 3 */3 * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

jobs:
  fetch-usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 使用率を取得（失敗時は既存データを維持）
        run: python3 scripts/fetch_usage.py
      - name: 変更があればコミット
        run: |
          if git diff --quiet -- data/usage.json; then
            echo "usage.json に変更なし（既存データを維持）"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/usage.json
            git commit -m "chore: 使用率データを自動更新"
            git push
          fi
